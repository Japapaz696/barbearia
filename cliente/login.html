<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - Barbado's Barbearia</title>
    <link rel="stylesheet" href="../css/style.css">
    <link rel="stylesheet" href="../css/cliente.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body class="auth-body">
    <div class="auth-container">
        <div class="auth-box">
            <div class="auth-header">
                <h1><i class="fas fa-scissors"></i> BARBADO'S</h1>
                <p>Acesse sua conta</p>
            </div>
            <form id="formLogin" class="auth-form">
                <div class="form-group">
                    <label><i class="fas fa-phone"></i> Telefone (com DDD)</label>
                    <input type="tel" id="telefoneLogin" placeholder="(31) 99999-9999" required>
                </div>
                <div class="form-group">
                    <label><i class="fas fa-lock"></i> Senha</label>
                    <input type="password" id="senhaLogin" placeholder="Sua senha" required>
                </div>
                <button type="submit" class="btn btn-primary btn-block">
                    <i class="fas fa-sign-in-alt"></i> Entrar
                </button>
                <p class="auth-link">Não tem conta? <a href="cadastro.html">Cadastre-se aqui</a></p>
            </form>
            <div class="auth-back">
                <a href="../index.html"><i class="fas fa-arrow-left"></i> Voltar ao site</a>
            </div>
        </div>
    </div>
    <script src="../js/senha.js"></script>
<script src="../js/cliente.js"></script>
</body>
</html>
