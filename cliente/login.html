<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Acesse sua conta na Barbado's Barbearia para acompanhar agendamentos, pontos e histórico.">
    <meta name="theme-color" content="#1a1a1a">
    <meta name="robots" content="noindex">
    <title>Entrar - Barbado's Barbearia</title>
    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Crect width='100' height='100' rx='20' fill='%231a1a1a'/%3E%3Ctext x='50' y='68' text-anchor='middle' font-size='58'%3E%F0%9F%92%88%3C/text%3E%3C/svg%3E">
    <link rel="stylesheet" href="../css/style.css">
    <link rel="stylesheet" href="../css/cliente.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body class="auth-body">
    <main class="auth-container">
        <div class="auth-box">
            <div class="auth-header">
                <h1><i class="fas fa-scissors" aria-hidden="true"></i> BARBADO'S</h1>
                <p>Acesse sua conta</p>
            </div>
            <div class="demo-note" role="note">
                <i class="fas fa-flask" aria-hidden="true"></i>
                <span>Área de demonstração: sua conta fica salva apenas neste navegador.</span>
            </div>
            <form id="formLogin" class="auth-form" novalidate>
                <div class="form-group">
                    <label for="telefoneLogin"><i class="fas fa-phone" aria-hidden="true"></i> Telefone (com DDD)</label>
                    <input type="tel" id="telefoneLogin" name="telefone" autocomplete="tel" placeholder="(31) 99999-9999" required>
                </div>
                <div class="form-group">
                    <label for="senhaLogin"><i class="fas fa-lock" aria-hidden="true"></i> Senha</label>
                    <input type="password" id="senhaLogin" name="senha" autocomplete="current-password" placeholder="Sua senha" required>
                </div>
                <button type="submit" class="btn btn-primary btn-block">
                    <i class="fas fa-sign-in-alt" aria-hidden="true"></i> Entrar
                </button>
                <p class="auth-link">Não tem conta? <a href="cadastro.html">Cadastre-se aqui</a></p>
            </form>

            <div class="auth-back">
                <a href="../index.html"><i class="fas fa-arrow-left" aria-hidden="true"></i> Voltar ao site</a>
            </div>
        </div>
    </main>
    <div id="notificacoes" aria-live="polite"></div>
    <script src="../js/seguranca.js"></script>
    <script src="../js/senha.js"></script>
    <script src="../js/cliente.js"></script>
</body>
</html>
